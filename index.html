<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D2 Sketchpad</title>
  </head>
  <body>
    <main>
      <h1>Sketchpad</h1>

      <canvas
        id="canvas"
        width="500"
        height="500"
        style="outline: 5px solid #333; touch-action: none"
      ></canvas>

      <div>
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="redraw">Redraw</button>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
